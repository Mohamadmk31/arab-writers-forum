<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتدى الرابطة العربية للكُتّاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        darkCard: '#1D1D1D',
                        primaryGold: '#C89B3C',
                        lightBg: '#FFFFFF',
                        lightCard: '#F5F5F5',
                        lightText: '#222222'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-white font-sans transition-colors duration-300 min-h-screen flex flex-col">

    <!-- شريط التنقل العلوي -->
    <header class="bg-darkCard border-b border-primaryGold/20 sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-primaryGold text-2xl font-bold"><i class="fa-solid fa-feather-pointed"></i></span>
            <h1 class="font-bold text-lg hidden sm:block">رابطة الكُتّاب</h1>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="toggleDarkMode()" class="text-primaryGold p-2 rounded-full hover:bg-white/5 transition"><i id="themeIcon" class="fa-solid fa-sun"></i></button>
            <div class="flex items-center gap-2 cursor-pointer bg-primaryGold/10 px-3 py-1.5 rounded-full border border-primaryGold/30">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=writer" alt="أبو العبد" class="w-8 h-8 rounded-full bg-primaryGold/20">
                <span class="text-sm font-medium">محمد عقاد</span>
                <span class="text-xs text-primaryGold font-bold px-2 py-0.5 bg-primaryGold/20 rounded">رئيس الموقع</span>
            </div>
        </div>
    </header>

    <!-- شريط الإعلانات العلوي -->
    <div class="bg-primaryGold/10 border-b border-primaryGold/30 py-2 px-4 overflow-x-auto whitespace-nowrap">
        <div class="inline-flex gap-4">
            <div class="bg-darkCard border border-primaryGold/40 px-4 py-2 rounded-lg text-xs flex items-center gap-2">
                <span class="text-primaryGold font-bold"><i class="fa-solid fa-bullhorn"></i> إعلان رسمي:</span>
                <span>انطلاق فعاليات الملتقى الأدبي السنوي قريباً.</span>
            </div>
            <div class="bg-darkCard border border-primaryGold/40 px-4 py-2 rounded-lg text-xs flex items-center gap-2">
                <span class="text-primaryGold font-bold"><i class="fa-solid fa-trophy"></i> مسابقة القصة:</span>
                <span>آخر موعد لاستلام المشاركات هو نهاية الشهر.</span>
            </div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="flex-1 flex flex-col md:flex-row">
        <!-- القائمة الجانبية للغرف -->
        <aside class="w-full md:w-64 bg-darkCard border-l border-primaryGold/20 p-4 flex flex-col gap-2">
            <h2 class="text-primaryGold font-bold text-sm mb-2 uppercase tracking-wider">الغرف الأدبية</h2>
            <button onclick="switchRoom('القاعة العامة')" class="room-btn w-full text-right px-3 py-2 rounded-lg bg-primaryGold/20 text-primaryGold font-medium transition flex items-center gap-2"><i class="fa-solid fa-comments"></i> القاعة العامة</button>
            <button onclick="switchRoom('قاعة الشعر')" class="room-btn w-full text-right px-3 py-2 rounded-lg hover:bg-white/5 transition flex items-center gap-2"><i class="fa-solid fa-feather"></i> قاعة الشعر</button>
            <button onclick="switchRoom('قاعة الرواية')" class="room-btn w-full text-right px-3 py-2 rounded-lg hover:bg-white/5 transition flex items-center gap-2"><i class="fa-solid fa-book-open"></i> قاعة الرواية</button>
            <button onclick="switchRoom('قاعة النقد الأدبي')" class="room-btn w-full text-right px-3 py-2 rounded-lg hover:bg-white/5 transition flex items-center gap-2"><i class="fa-solid fa-magnifying-glass"></i> قاعة النقد الأدبي</button>
            <button onclick="switchRoom('قاعة الورش التدريبية')" class="room-btn w-full text-right px-3 py-2 rounded-lg hover:bg-white/5 transition flex items-center gap-2"><i class="fa-solid fa-chalkboard-user"></i> الورش التدريبية</button>
            <button onclick="switchRoom('قاعة الاستراحة')" class="room-btn w-full text-right px-3 py-2 rounded-lg hover:bg-white/5 transition flex items-center gap-2"><i class="fa-solid fa-mug-hot"></i> قاعة الاستراحة</button>
        </aside>

        <!-- نافذة المحادثة -->
        <main class="flex-1 flex flex-col p-4">
            <div id="roomTitle" class="text-primaryGold font-bold text-lg mb-4 border-b border-white/10 pb-2">القاعة العامة</div>
