                </div>

                </div>
                <div>
                    <label class="text-xs text-gray-300 block mb-1">الصفة / الصلاحية التجريبية</label>
                    <select id="loginRole" class="w-full bg-darkBg border border-white/10 rounded-lg px-4 py-2.5 text-sm focus:border-primaryGold focus:outline-none">
                        <option value="رئيس الموقع">رئيس الموقع (صلاحيات إدارية كاملة)</option>
                        <option value="سوبر آدمن">سوبر آدمن</option>
                        <option value="مشرف">مشرف</option>
                        <option value="عضو">عضو</option>
                    </select>
                </div>
            </div>

            <button onclick="completeLogin()" class="w-full bg-primaryGold text-darkBg font-bold py-3 rounded-xl hover:bg-primaryGold/90 transition flex items-center justify-center gap-2 shadow-lg">
                <i class="fa-brands fa-google"></i> المتابعة والدخول للمنصة
            </button>
        </div>
    </div>
