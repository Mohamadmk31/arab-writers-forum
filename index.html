<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتدى الرابطة العربية للكُتّاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .gold-glow { text-shadow: 0 0 10px rgba(200, 155, 60, 0.7); }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col">

    <!-- بوابة الدخول السريعة -->
    <div id="loginModal" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4">
        <div class="bg-[#1D1D1D] border border-[#C89B3C]/50 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl">
            <div class="w-16 h-16 bg-[#C89B3C]/20 text-[#C89B3C] rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-feather-pointed"></i>
            </div>
            <h2 class="text-2xl font-bold text-[#C89B3C] mb-1">الرابطة العربية للكُتّاب</h2>
            <p class="text-gray-400 text-xs mb-6">منصة التواصل الأدبي الآمنة والمشفرة</p>
            
            <div class="space-y-3 text-right mb-6">
                <div>
                    <label class="text-xs text-gray-300 block mb-1">الاسم الظاهر</label>
                    <input type="text" id="loginName" value="أديب الرابطة" class="w-full bg-[#121212] border border-white/15 rounded-lg px-4 py-2.5 text-sm text-white focus:border-[#C89B3C] focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-gray-300 block mb-1">الدولة</label>
                    <input type="text" id="loginCountry" value="سوريا" class="w-full bg-[#121212] border border-white/15 rounded-lg px-4 py-2.5 text-sm text-white focus:border-[#C89B3C] focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-gray-300 block mb-1">الرتبة / الصلاحية</label>
                    <select id="loginRole" class="w-full bg-[#121212] border border-white/15 rounded-lg px-4 py-2.5 text-sm text-white focus:border-[#C89B3C] focus:outline-none">
                        <option value="رئيس الموقع">رئيس الموقع (صلاحيات كاملة)</option>
                        <option value="سوبر آدمن">سوبر آدمن</option>
                        <option value="آدمن">آدمن</option>
                        <option value="مشرف">مشرف</option>
                        <option value="عضو">عضو</option>
                    </select>
                </div>
            </div>

            <button type="button" onclick="enterForum()" class="w-full bg-[#C89B3C] text-[#121212] font-bold py-3 rounded-xl hover:opacity-90 active:scale-95 transition text-base cursor-pointer">
                المتابعة والدخول للمنصة ←
            </button>
        </div>
    </div>

    <!-- الشريط العلوي -->
    <header class="bg-[#1D1D1D] border-b border-[#C89B3C]/25 sticky top-0 z-40 px-4 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-2.5">
            <span class="text-[#C89B3C] text-2xl"><i class="fa-solid fa-feather-pointed"></i></span>
            <div>
                <h1 class="font-bold text-base leading-tight">الرابطة العربية للكُتّاب</h1>
                <span class="text-[10px] text-green-400">● اتصال مشفر E2EE</span>
            </div>
        </div>

        <!-- أزرار التنقل -->
        <nav class="flex flex-wrap items-center gap-1.5 bg-black/30 p-1 rounded-xl">
            <button type="button" onclick="showSection('rooms')" id="btn-rooms" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-[#C89B3C] text-[#121212]">الغرف (6)</button>
            <button type="button" onclick="showSection('library')" id="btn-library" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-gray-300 hover:bg-white/10">المكتبة الأدبية</button>
            <button type="button" onclick="showSection('voice')" id="btn-voice" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-gray-300 hover:bg-white/10">الجلسات الصوتية</button>
            <button type="button" onclick="showSection('tickets')" id="btn-tickets" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-gray-300 hover:bg-white/10">الشكاوى</button>
            <button type="button" onclick="showSection('admin')" id="btn-admin" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-red-600/20 text-red-400 border border-red-500/40">⚙️ لوحة الإدارة</button>
        </nav>

        <!-- معلومات العضو -->
        <div class="flex items-center gap-2">
            <button type="button" onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-white/10 text-[#C89B3C] flex items-center justify-center">🌓</button>
            <button type="button" onclick="document.getElementById('loginModal').style.display='flex'"
